[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pa-dvsa"
version = "1.0.0"
description = "Protection-aware dynamic voltage security assessment for overvoltage cascades (Iberian blackout study)."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "andes==1.9.3",
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=1.5",
  "matplotlib>=3.6",
  "kvxopt>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long validation runs against nonlinear time-domain simulation"]
